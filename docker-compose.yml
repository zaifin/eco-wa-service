version: '3.9'

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: 77EvglLOhhA31Q37S25mAKZyv8OZBEHN
      POSTGRES_DB: saleor_pnou
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"


  whatsapp-service:
    build:
      context: ./whatsapp-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/saleor_pnou
      - SPRING_DATASOURCE_USERNAME=saleor
      - SPRING_DATASOURCE_PASSWORD=77EvglLOhhA31Q37S25mAKZyv8OZBEHN
      - WH_VERIFY_TOKEN=your_verify_token_here
    depends_on:
      - redis
      - postgres

  conversation-service:
